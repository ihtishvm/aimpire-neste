  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
/* Mappehode */
#guide h3 .sti{margin-inline-end:8px;font-size:1.05em}
.sec > h2.dupl{display:none}
.vhead{display:flex;align-items:center;gap:14px;margin:16px 0 4px;padding:14px 16px;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(var(--ink-raise,#1A1A22),var(--ink-raise,#1A1A22)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.vhead[hidden]{display:none}
.vhead::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(127,127,127,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(127,127,127,.08) 1px,transparent 1px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
html[dir="rtl"] .vhead::after{-webkit-mask-image:linear-gradient(270deg,transparent,#000);mask-image:linear-gradient(270deg,transparent,#000)}
.vhead .vic{flex:0 0 52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:1.7rem;background:var(--ink);border:1px solid var(--rule)}
.vhead .vtx{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;z-index:1}
.vhead .vtx b{font:800 1.3rem/1.15 var(--display)}
.vhead .vtx span{font-size:.86rem;line-height:1.35;color:var(--chalk-dim)}

/* #142 Snarveier etter oppgave: store, like ruter, ett trykk. */
.goals{margin:0 0 18px}
.goals .gt{font:800 1.05rem/1.2 var(--display);margin:0 0 10px;color:var(--chalk)}
.goals .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goals .goal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;
  border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--rule);text-align:center;text-decoration:none;color:var(--chalk)}
.goals .goal:active{transform:scale(.97)}
.goals .gi{font-size:1.6rem;line-height:1}
.goals .gl{font-size:.82rem;font-weight:700;line-height:1.25}
:root[data-theme="light"] .goals .goal{background:rgba(0,0,0,.04)}
.mfeat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfeat .plate:only-child{grid-column:1 / -1}
/* #256: pip-linjalen i Lær */
.pipr{display:grid;gap:10px;padding:14px;border:1px solid var(--rule);border-radius:16px;background:var(--ink-deep)}
.pipr .prad{display:flex;gap:6px;flex-wrap:wrap}
.pipr .prad button{flex:1;min-height:44px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;color:var(--chalk);font:700 .9rem/1 var(--face);cursor:pointer}
.pipr .prad button.on{background:var(--grad);color:#08080B;border-color:transparent}
.pipr .ppris{font:800 1.35rem/1.3 var(--mono);text-align:center;white-space:nowrap;overflow-x:auto}
.pipr .ppris b{padding:0 3px;border-radius:6px;background:linear-gradient(135deg,#15D8C4,#5B8BFF);color:#08080B}
.pipr .pslide{width:100%;min-height:36px;accent-color:#15D8C4}
.pipr .pres{font:800 1.15rem/1.3 var(--mono);text-align:center}
.pipr .pres.pos{color:#3DDC97} .pipr .pres.neg{color:#FF6B6E}
:root:not([data-theme="dark"]) .pipr .pres.pos{color:#0E8A5A} :root:not([data-theme="dark"]) .pipr .pres.neg{color:#C62828}
.pipr .pnote{font-size:.86rem;line-height:1.4;color:var(--chalk-dim);text-align:center}
.pipr .pnote:empty{display:none}   /* #254: ett kort alene = hele bredden */
.mneste{margin-bottom:18px}
.mneste .plate{min-height:0;border-color:color-mix(in srgb,#15D8C4 45%,var(--rule))}
.mib{margin-top:14px}
.mfeat .plate{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:16px 14px 14px;min-height:168px;position:relative;overflow:hidden}
.mfeat .plate > .stripe{position:absolute;inset:0 0 auto 0;height:3px;min-height:0;width:auto;background:var(--grad)}
.mfeat .plate > .bd{padding:6px 0 0}
.mfeat .plate > .go{position:absolute;bottom:14px;inset-inline-end:2px}
.mfeat .plate .t{font-size:1.25rem !important}
.mfeat .plate .d{font-size:.84rem;line-height:1.4}
.mfeat .plate .mic{font-size:1.7rem;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.mlist .plate{grid-template-columns:5px 34px 1fr 30px}
.mlist .plate .mic{font-size:1.3rem;text-align:center}
.mlist .plate > .stripe{grid-column:1;grid-row:1}.mlist .plate > .mic{grid-column:2;grid-row:1}.mlist .plate > .bd{grid-column:3;grid-row:1}.mlist .plate > .go{grid-column:4;grid-row:1}
.mlist .plate > .bd{padding:15px 0}
.mlist .plate .t{font-size:1.02rem;margin-bottom:3px}
.mlist .plate .d{font-size:.86rem;line-height:1.4}
.mlist .plate > .stripe{min-height:70px}
@media (max-width:340px){.mfeat{grid-template-columns:1fr}}

.menu .mlede{margin:0 0 16px;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
.menu .share{display:inline-flex;justify-self:start;width:auto;align-items:center;gap:9px;margin:18px 0 0;padding:11px 18px;min-height:44px;
  border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--chalk);
  font:600 .95rem/1 var(--display);cursor:pointer}
.menu .share:hover,.menu .share:focus-visible{border-color:var(--gold);outline:none}
.menu .share svg{width:18px;height:18px;flex:none}
.menu .sharehint{margin:22px 0 0;font-size:.9rem;line-height:1.4;color:var(--chalk-dim)}
.menu .sharehint + .share{margin-top:8px}
.plate{display:grid;grid-template-columns:5px 1fr 30px;align-items:center;gap:0 18px;
  width:100%;text-align:start;font:inherit;color:inherit;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;
  transition:border-color .18s ease,box-shadow .18s ease,transform .12s ease}
.plate > .stripe{align-self:stretch;min-height:94px;background:var(--rule)}
.plate > .bd{padding:19px 0}
.plate > .go{justify-self:end;margin-inline-end:18px;width:10px;height:10px;
  color:var(--gold-soft);transition:transform .18s ease}
/* Tegnet, ikke et tegn: Nastaliq tegner U+203A som en parentes. */
.plate > .go::before{content:"";display:block;width:8px;height:8px;
  border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
[dir=rtl] .plate > .go{transform:scaleX(-1)}
.plate:hover{border-color:var(--gold-soft);box-shadow:0 6px 22px rgba(163,21,159,.10)}
.plate:hover > .go{transform:translateX(3px)}
[dir=rtl] .plate:hover > .go{transform:scaleX(-1) translateX(3px)}
.plate:active{transform:translateY(1px)}
:root[data-theme="dark"] .plate[data-cat="start"]{border-color:#4A3A5E}
:root[data-theme="dark"] .plate:hover{box-shadow:0 6px 22px rgba(0,0,0,.35)}
.plate .t{display:block;margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 92;font-size:1.2rem;letter-spacing:-.012em;color:var(--chalk)}
.plate .d{display:block;margin:0;color:var(--chalk-dim);font-size:.95rem;line-height:1.52;
  max-width:34rem}
.plate[data-cat="start"]{border-color:#E3C6E2}
.plate[data-cat="start"] .t{font-size:1.32rem}
.plate[data-cat="start"] > .stripe{background:var(--grad-ink)}
/* Hver vei inn har sin farge fra logoen - slik presentasjonene skiller
   kategorier med farge. Kanten er fargen, flaten bare et snev av den. */
.plate[data-cat="tools"]{--cat:#0B7C72}
.plate[data-cat="earn"]{--cat:#A3159F}
.plate[data-cat="learn"]{--cat:#C99A00}
.plate[data-cat="faq"]{--cat:#1B4FD8}
.plate[data-cat="ib"]{--cat:#5B3FD1}
.plate[data-cat]:not([data-cat="start"]) > .stripe{background:var(--cat)}
:root:not([data-theme="dark"]) .plate[data-cat]:not([data-cat="start"]){
  background:color-mix(in srgb, var(--cat) 6%, #FFFFFF);border-color:color-mix(in srgb, var(--cat) 22%, #FFFFFF)}
:root[data-theme="dark"] .plate[data-cat="tools"]{--cat:#2FE0CC}
:root[data-theme="dark"] .plate[data-cat="earn"]{--cat:#E04DDE}
:root[data-theme="dark"] .plate[data-cat="learn"]{--cat:#FBE16B}
:root[data-theme="dark"] .plate[data-cat="faq"]{--cat:#5B8BFF}
:root[data-theme="dark"] .plate[data-cat="calc"]{--cat:#E04DDE}
:root[data-theme="dark"] .plate[data-cat="ib"]{--cat:#A99BFF}
.plate[data-cat="learn"] > .stripe{background:var(--gold)}
.plate[data-cat="earn"]  > .stripe{background:var(--gold-metal)}
.plate[data-cat="tools"] > .stripe{background:var(--edge-ui)}
html[data-font="deva"] .plate .t,html[data-font="nastaliq"] .plate .t,
html[data-font="naskh"] .plate .t{font-family:var(--face);letter-spacing:0}
/* Framdrift paa foerste plate. Ekte tall fra stegene som er huket av,
   ikke pynt - den er grunnen til aa komme tilbake. */
.plate .pg{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:.85rem;
  color:var(--gold-soft);font-variant-numeric:tabular-nums}
.plate .pg i{display:block;flex:0 0 80px;height:4px;border-radius:2px;background:var(--rule)}
.plate .pg i > b{display:block;height:100%;border-radius:2px;background:var(--gold)}
/* ---------- opptak ---------- */
.clipf,.clip{display:block;margin:14px 0 0;aspect-ratio:720/1558;height:min(62vh,520px);
  width:auto;max-width:100%;border-radius:14px;border:1px solid var(--rule);background:#000}
.clipf{position:relative;padding:0;overflow:hidden;cursor:pointer}
.clipf img{display:block;width:100%;height:100%;object-fit:cover;opacity:.55}
.clipf .play{position:absolute;inset-inline:10px;bottom:12px;display:flex;align-items:center;
  gap:10px;padding:11px 14px;border-radius:999px;background:rgba(8,8,11,.86);color:#F4F2F7;
  font:600 .9rem/1.3 var(--face);text-align:start}
.clipf .play::before{content:"";flex:0 0 0;border-style:solid;border-width:7px 0 7px 12px;
  border-color:transparent transparent transparent #FBE16B}
[dir=rtl] .clipf .play::before{border-width:7px 12px 7px 0;border-color:transparent #FBE16B transparent transparent}
.clipf:hover img{opacity:.7}
/* ---------- avkryssing ---------- */
.markd{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:11px 16px;
  min-height:46px;width:100%;max-width:22rem;background:none;font:inherit;font-weight:600;
  color:var(--chalk);border:1.5px dashed var(--edge-ui);border-radius:10px;cursor:pointer;
  text-align:start;transition:background .15s,border-color .15s}
.markd::before{content:"";flex:0 0 20px;height:20px;border-radius:5px;
  border:2px solid var(--edge-ui);box-sizing:border-box}
.markd:hover{border-color:var(--gold-soft)}
.markd[aria-pressed="true"]{border-style:solid;border-color:var(--gold-metal);
  color:var(--chalk-dim);font-weight:500}
.markd[aria-pressed="true"]::before{content:"\2713";display:grid;place-items:center;
  background:var(--gold-metal);border-color:var(--gold-metal);color:#0C1118;font-size:.8rem;font-weight:800}
.progn{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.progn .alld{color:var(--chalk);font-family:var(--face);font-size:.95rem;font-weight:600}
.nextb{background:none;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;
  font:inherit;font-family:var(--face);font-size:.88rem;color:var(--gold-soft);cursor:pointer}
.nextb:hover{border-color:var(--gold-soft)}
.guide > li{scroll-margin-top:70px}
.guide > li.folded:not(.open) > :not(.tick):not(h3){display:none}
.guide > li.folded{padding-bottom:18px}
.guide > li.folded > h3{cursor:pointer;display:flex;align-items:center;gap:10px;margin:0;min-height:40px}
.guide > li.folded > h3::after{content:"";width:8px;height:8px;border-right:2px solid var(--chalk-dim);border-bottom:2px solid var(--chalk-dim);
  transform:rotate(45deg);margin-inline-start:auto;margin-inline-end:6px;transition:transform .15s}
.guide > li.folded.open > h3::after{transform:rotate(-135deg)}
.guide > li.folded > h3:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;border-radius:6px}
.guide > li.folded:not(.done) > h3{color:var(--chalk-dim)}
.guide > li.current > h3{font-size:1.15rem}
.guide .stuck{display:inline-flex;align-items:center;min-height:36px;margin:10px 0 0;color:var(--gold-soft);font-size:.9rem;text-decoration:none}
.guide .stuck:hover,.guide .stuck:focus-visible{text-decoration:underline;text-underline-offset:3px}
/* ---------- apper ---------- */
.appc{background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;
  padding:18px 18px 18px;margin:0 0 12px}
.appc h3{margin:0 0 6px;font-family:var(--display);font-size:1.12rem;color:var(--chalk)}
html[data-font="nastaliq"] .appc h3,html[data-font="naskh"] .appc h3,
html[data-font="deva"] .appc h3{font-family:Montserrat,system-ui,sans-serif}
.appc p{margin:0;color:var(--chalk-dim)}
.appc .ah{display:flex;align-items:center;gap:13px;margin:0 0 10px}
.appc .ah h3{margin:0}
.appc .ah img{flex:0 0 48px;width:48px;height:48px;border-radius:11px;
  box-shadow:0 0 0 1px rgba(20,16,28,.08)}
.stepapps{margin:14px 0 0}
.stepapps .appc{margin:0 0 10px}
/* ---------- kalkulator ---------- */
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 16px;max-width:var(--measure)}
.cin{display:grid;gap:6px;font-size:.86rem;color:var(--chalk-dim);flex:1 1 150px}
.cin input{font:700 1.2rem/1.2 var(--display);padding:11px 14px;border-radius:10px;border:1px solid var(--edge-ui);
  background:var(--ink-deep);color:var(--chalk);width:100%;font-variant-numeric:tabular-nums}
.cper{display:flex;flex-wrap:wrap;gap:6px}
.cper button{font:inherit;font-size:.86rem;padding:9px 12px;border-radius:999px;border:1px solid var(--rule);
  background:none;color:var(--chalk-dim);cursor:pointer}
.cper button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.cbig{display:grid;gap:4px;background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;
  padding:14px 16px;margin:0 0 12px;max-width:var(--measure)}
.cbig span{font-size:.86rem;color:var(--chalk-dim)}
.cbig strong{font:800 1.7rem/1.1 var(--display);color:var(--chalk);font-variant-numeric:tabular-nums}
.cbig small{font-size:.84rem;color:var(--chalk-dim)}
.bnl{display:grid;gap:10px;max-width:var(--measure)}
.bnl article{background:var(--ink-deep);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.bnl h3{margin:0 0 6px;font-size:1rem;line-height:1.3}
.bnl p{margin:4px 0 0;font-size:.92rem;line-height:1.55}
.bnl p b{display:block;font-size:.78rem;font-weight:600;color:var(--chalk-dim)}
/* Fra partnerens presentasjoner: store tall med skillelinje (12x | 24x),
   og kolonnekort med fargede faner. Formen er
   deres, fargene er Aimpires (logoens fire). */
.vs{background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 12px}
.vs h3{margin:0 0 4px}
.vsnum{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:4px 0 12px}
.vsnum span{font:800 clamp(2.8rem,13vw,3.8rem)/1 var(--display);letter-spacing:-.02em;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.vsnum span:first-child{background-image:linear-gradient(180deg,#1B4FD8 0%,#15D8C4 100%)}
.vsnum span:last-child{background-image:linear-gradient(180deg,#C21FBF 0%,#FBE16B 100%)}
:root:not([data-theme="dark"]) .vsnum span:last-child{background-image:linear-gradient(180deg,#A3159F 0%,#D98E04 100%)}
.vsnum i{display:block;width:0;height:58px;border-inline-start:2px dashed var(--edge-ui)}
.amp li.vs{border-inline-start:1px solid var(--rule)}
.vsrow{display:grid;grid-template-columns:1fr 1fr;gap:2px 0;padding:9px 0;border-top:1px solid var(--rule)}
.vsrow > span{grid-column:1 / -1;font-size:.84rem;color:var(--chalk-dim)}
.vsrow > b{text-align:center;font:700 1.02rem/1.3 var(--display);font-variant-numeric:tabular-nums;color:var(--chalk)}
.vs .vsnote{margin:10px 0 0;font-size:.86rem;color:var(--chalk-dim)}
/* Bank, fond eller Sonic (#founder 15.10): avkastning og risiko paa samme rad. */
.alt{margin:22px 0 6px;background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;padding:16px 14px 12px}
.alt h3{margin:0 0 4px}
.alt > p.lede{margin:0 0 12px;font-size:.95rem}
.alth,.altrow{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.alth b{font:800 .8rem/1.2 var(--display);text-align:center;padding:6px 2px;border-radius:999px;border:1px solid var(--edge-ui)}
.alth b:last-child{border-color:transparent;background:var(--grad-ink);color:#fff}
.altrow{padding:10px 0 9px;border-top:1px solid var(--rule)}
.altrow > span{grid-column:1 / -1;font-size:.82rem;color:var(--chalk-dim);margin-bottom:4px}
.altrow > b{font:600 .9rem/1.3 var(--face);text-align:center;color:var(--chalk);overflow-wrap:anywhere}
.altrow > b:last-child{font-weight:800}
.alt .vsnote{margin:8px 0 0;font-size:.8rem;color:var(--chalk-dim)}
.alt .disc{margin:10px 0 0;font-size:.82rem;color:var(--chalk);border-top:1px solid var(--rule);padding-top:10px}
.bnl article{padding:0;overflow:hidden}
.bnl article h3{margin:0;padding:10px 14px;background:var(--tab);color:#fff;font-size:.98rem}
.bnl article p{padding:0 14px}
.bnl article p:last-child{padding-bottom:13px}
.bnl article:nth-child(4n+1){--tab:#1B4FD8}
.bnl article:nth-child(4n+2){--tab:#0B7C72}
.bnl article:nth-child(4n+3){--tab:#A3159F}
.bnl article:nth-child(4n+4){--tab:#FBE16B}
.bnl article:nth-child(4n+4) h3{color:#14101C}
html[data-font="nastaliq"] .bnl p{line-height:2.05}
html[data-font="nastaliq"] .bnl p b{margin:0 0 2px;line-height:1.9}
html[data-font="nastaliq"] .vsrow > span{line-height:1.9}
html[data-font="nastaliq"] .vs .vsnote{line-height:2}
.acts{margin:6px 0 0;padding:0;list-style:none;max-width:var(--measure)}
.acts li{position:relative;padding-inline-start:18px;margin:6px 0;line-height:1.55}
.acts li::before{content:"";position:absolute;inset-inline-start:3px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.acts.vnote li::before{background:var(--ember)}
/* Delhaker erstatter kulepunktet: haken ER markoeren. */
.acts.subs > li{padding-inline-start:0}
.acts.subs > li::before{content:none}
/* Kort sjekk: to valg, og forklaringen kommer uansett hva man svarer. */
/* Foldet avsnitt: overskriften er knappen, og pilen sier at det er mer. */
/* Fagord i teksten: en stiplet strek sier at det finnes en forklaring. */
.ordb{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;
  cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;
  text-decoration-color:var(--gold-soft)}
.ordb:hover,.ordb:focus-visible{color:var(--gold-soft)}
.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  min-height:44px;margin:0 -4px;padding:0 4px}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary h3{margin:0;flex:1 1 auto}
.fold > summary::after{content:"";flex:0 0 auto;width:9px;height:9px;margin-inline-end:2px;
  border-inline-end:2px solid var(--gold-soft);border-block-end:2px solid var(--gold-soft);
  transform:rotate(45deg);transition:transform .15s ease}
.fold[open] > summary::after{transform:rotate(-135deg)}
.fold > p{margin-top:8px}
.qz{margin:14px 0 0;padding:13px 14px;border:1px solid var(--rule);border-radius:12px;
  background:var(--ink-deep);max-width:var(--measure)}
.qzt{display:block;font:800 .76rem/1 var(--display);letter-spacing:.08em;
  text-transform:uppercase;color:var(--gold-soft);margin-bottom:7px}
.qz > p{margin:0 0 11px}
.qzb{display:block;width:100%;min-height:44px;margin:7px 0 0;padding:10px 14px;
  border:1px solid var(--edge-ui);border-radius:10px;background:transparent;
  color:var(--chalk);font:600 .95rem/1.35 var(--face);text-align:start;cursor:pointer}
.qzb[aria-pressed="true"]{border-color:var(--gold-metal);background:var(--ink-raise)}
.qzb:disabled{cursor:default;opacity:.85}
.qzw{margin:12px 0 0;font-size:.9rem;color:var(--chalk-dim);
  border-top:1px solid var(--rule);padding-top:10px}
html[data-font="nastaliq"] .acts li{line-height:2.05}
html[data-font="nastaliq"] .acts li::before{top:.95em}
.p2p{margin:14px 0 0;max-width:var(--measure);border:1px solid var(--rule);border-radius:12px;background:var(--ink-deep);padding:0 14px}
.p2p summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--chalk)}
.p2p p{margin:0 0 10px}
.p2p .p2pv{display:inline-block;margin:0 0 10px;padding:9px 14px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none;font-weight:600}
.p2p ol{margin:0 0 12px;padding-inline-start:20px}
.p2p ol > li{margin:10px 0}
.p2p h4{margin:0 0 4px;font-size:.98rem}
.p2p ul{margin:0;padding-inline-start:18px}
.p2p ul li{margin:4px 0;line-height:1.55}
html[data-font="nastaliq"] .p2p ul li, html[data-font="nastaliq"] .p2p p{line-height:2.05}
/* Hopp-knapper, glidebryter, hurtigvalg og kostnadsstolpe */
/* Founder 17.10: ingen avklippede faner paa mobil - raden bryter til to linjer
   i stedet for aa gjemme «Withdrawals» bak kanten. */
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px;margin:0}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;font:600 .82rem/1 var(--face);padding:8px 14px;min-height:40px;border-radius:999px;border:1px solid var(--rule);
  background:var(--ink-deep);color:var(--chalk);cursor:pointer;white-space:nowrap}
.jump button:hover,.jump button:focus-visible{border-color:var(--gold);color:var(--chalk)}
.rs-pick{margin:6px 0 0;font:700 .92rem/1.3 ui-monospace,monospace;color:var(--gold-soft);
  letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sec{scroll-margin-top:120px}
.sec.forst{padding-top:14px}
/* Soeket hopper rett til svaret: ogsaa enkeltelementer maa ha luft til den
   klebrige topplinja, ellers gjemmer svaret seg bak den (founder 17.10). */
#guide > li,.qa,.learn > details,.rail > li,[id^="earn-"]{scroll-margin-top:118px}
.cslide{flex:1 1 100%;width:100%;accent-color:var(--gold);margin:2px 0}
.cpre{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.cpre button{font:600 .86rem/1 var(--display);padding:8px 13px;min-height:40px;border-radius:999px;border:1px solid var(--edge-ui);background:transparent;color:var(--chalk);cursor:pointer;font-variant-numeric:tabular-nums}
.cpre button:hover{border-style:solid;border-color:var(--gold)}
.cbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:12px 0 0;max-width:var(--measure);background:var(--rule)}
.cbar i{display:block;height:100%;transition:width .25s ease}
.cbar .k{background:linear-gradient(90deg,#1B4FD8,#15D8C4)}
.cbar .fx{background:repeating-linear-gradient(45deg,#15D8C4 0 4px,rgba(21,216,196,.35) 4px 8px)}
.cbar .f{background:#C21FBF}
.cbar .c{background:#FBE16B}
.ctab dt::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:7px;vertical-align:middle;background:transparent}
.ctab dt:nth-of-type(2)::before{background:#FBE16B}
.ctab dt:nth-of-type(3)::before{background:#C21FBF}
.ctab dt:nth-of-type(4)::before{background:linear-gradient(90deg,#1B4FD8,#15D8C4)}
.plate[data-cat="calc"]{--cat:#A3159F}
.plate[data-cat="calc"] > .stripe{background:var(--cat)}
@media (prefers-reduced-motion:reduce){.cbar i{transition:none}}
/* Inntekt delt i faner: bare én del om gangen, så det ikke blir for mye på én gang. */
.shell[data-view="earn"][data-tab="sonic"]    .sec[data-tab]:not([data-tab="sonic"]),
.shell[data-view="earn"][data-tab="results"]  .sec[data-tab]:not([data-tab="results"]),
.shell[data-view="earn"][data-tab="calc"]     .sec[data-tab]:not([data-tab="calc"]),
.shell[data-view="earn"][data-tab="withdraw"] .sec[data-tab]:not([data-tab="withdraw"]),
.shell[data-view="earn"][data-tab="ib"]       .sec[data-tab]:not([data-tab="ib"]){display:none}
.shell[data-view="tools"][data-tab="hours"]   .sec[data-tab]:not([data-tab="hours"]),
.shell[data-view="tools"][data-tab="sizing"]  .sec[data-tab]:not([data-tab="sizing"]),
.shell[data-view="tools"][data-tab="journal"] .sec[data-tab]:not([data-tab="journal"]),
.shell[data-view="tools"][data-tab="toolkit"] .sec[data-tab]:not([data-tab="toolkit"]){display:none}
.jump button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.ctab{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:12px 0 0;max-width:var(--measure);font-size:.92rem}
.ctab dt{color:var(--chalk-dim)}
.ctab dd{margin:0;text-align:end;font-variant-numeric:tabular-nums;color:var(--chalk)}
.ctab dt:last-of-type,.ctab dd:last-of-type{font-weight:700;color:var(--chalk);border-top:1px solid var(--rule);padding-top:6px}
.crisk{border:1px solid var(--ember);border-radius:14px;padding:12px 16px;margin:0 0 12px;max-width:var(--measure)}
.crisk h3{margin:0 0 8px;font-size:1rem;color:var(--ember)}
.crisk ul{margin:0;padding-inline-start:18px;color:var(--chalk)}
.crisk li{margin:0 0 6px}
/* ---------- resultater ---------- */
.rsfig{max-width:var(--measure);margin:6px 0 4px}
.rsfig svg{display:block;width:100%;height:auto}
.rsleg{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.86rem;color:var(--chalk-dim);margin:0 0 16px}
.rsleg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.rsleg span{margin-inline-end:12px}
.rsstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:0 0 18px;max-width:var(--measure)}
.rsstat div{background:var(--ink-deep);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.rsstat dt{font-size:.78rem;color:var(--chalk-dim);margin:0 0 3px}
.rsstat dd{margin:0;font:700 1.08rem/1.2 var(--display);color:var(--chalk);font-variant-numeric:tabular-nums}
.rsnotes{max-width:var(--measure);margin:0 0 14px;padding-inline-start:18px;color:var(--chalk-dim)}
.rsnotes li{margin:0 0 8px}
.rstab{max-width:var(--measure);margin:12px 0 0}
.rstab summary{cursor:pointer;color:var(--gold-soft);font-weight:600}
.rstab table{width:100%;border-collapse:collapse;margin:10px 0 0;font-size:.86rem;font-variant-numeric:tabular-nums}
.rstab th,.rstab td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:end}
.rstab th:first-child,.rstab td:first-child{text-align:start}
.rsrc{font-size:.88rem;color:var(--chalk-dim)}
.rsrc a{color:var(--gold-soft);font-weight:600}
/* ---------- spoersmaal og svar ---------- */
.faqs{display:block;width:100%;max-width:var(--measure);margin:0 0 16px;padding:13px 16px;
  font:inherit;color:var(--chalk);background:var(--ink-deep);border:1px solid var(--edge-ui);
  border-radius:12px}
.faqs::placeholder{color:var(--chalk-dim)}
.faql{max-width:var(--measure)}
.qa{border:1px solid var(--rule);border-radius:12px;background:var(--ink-deep);margin:0 0 8px}
.qa[hidden]{display:none}
.qa summary{list-style:none;cursor:pointer;padding:15px 44px 15px 16px;position:relative;
  font-weight:600;color:var(--chalk);line-height:1.45}
[dir=rtl] .qa summary{padding:15px 16px 15px 44px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";position:absolute;inset-inline-end:16px;top:12px;font-size:1.3rem;
  color:var(--gold-soft);font-weight:400}
.qa[open] summary::after{content:"\2212"}
.qa p{margin:0;padding:0 16px 16px;color:var(--chalk-dim)}
html[data-font="nastaliq"] .qa summary{font-weight:400}
/* ---------- tilbake til menyen ---------- */
/* Toppstripa klistrer seg: «Kom i gang» er ni steg langt, veien tilbake skal
   ikke ligge ni steg unna, og hvor langt man er kommet skal alltid synes. */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  justify-content:space-between;margin:14px 0 0;padding:10px 0;background:var(--ink)}
.topbar[hidden]{display:none !important}
.topbar{flex-wrap:wrap;row-gap:4px}
.topbar .jump{flex:1 1 100%;order:3}
.topbar .back{white-space:nowrap}
.minip{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;font-weight:700}
.minip i{display:block;width:70px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.minip b{display:block;height:100%;background:var(--gold-metal);transition:width .2s}
.shell:not([data-view="start"]) .minip{display:none}
.back{display:inline-flex;align-items:center;gap:9px;
  margin:0;padding:9px 17px;background:var(--ink);
  border:1px solid var(--rule);border-radius:999px;font:inherit;
  font-size:.94rem;color:var(--gold-soft);cursor:pointer;transition:border-color .18s}
.back:hover{border-color:var(--gold-soft)}
.back::before{content:"\2190";font-size:1.05em}
[dir=rtl] .back::before{content:"\2192"}
@media (prefers-reduced-motion:no-preference){
  .plate{animation:rise .42s cubic-bezier(.2,.7,.3,1) backwards}
  .plate:nth-of-type(2){animation-delay:.05s}
  .plate:nth-of-type(3){animation-delay:.10s}
  .plate:nth-of-type(4){animation-delay:.15s}
}

/* ============================================================
   KNAPPESYSTEM OG HIERARKI (16.10). Én signatur: «siktelinja» - merkevarens
   gradient som tynn strek - er det eneste som sier «aktiv/viktig». Tre
   knappenivaaer, én regel for aktive brikker (fylt jet), to fremhevede kort
   paa menyen og resten som liste. Bare CSS + menyens gruppering; ingen tekst.
   ============================================================ */
:root{--aim:var(--grad-ink);--r-card:16px;--r-btn:14px;--r-chip:999px;--r-in:12px}

/* --- Nivaa 1: hovedhandling. Fylt jet, siktelinje under teksten. --- */
.out .apply,.nextb,.joinbtn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:14px 22px 16px;border:0;border-radius:var(--r-btn);
  background:var(--jet);color:var(--jet-on);font:800 1rem/1.15 var(--display);
  letter-spacing:0;text-decoration:none;cursor:pointer;filter:none;
  transition:transform .12s ease,filter .18s ease}
.out .apply::after,.nextb::after,.joinbtn::after{content:"";position:absolute;inset-inline:18px;bottom:8px;height:2px;
  border-radius:2px;background:var(--aim);opacity:.95}
.out .apply:hover,.nextb:hover,.joinbtn:hover,.joinbtn:focus-visible{filter:brightness(1.07)}
.out .apply:active,.nextb:active,.joinbtn:active{transform:scale(.985)}
.out .apply{width:100%;margin-top:14px}
.nextb{width:100%;margin-top:4px}
/* Neste steg paa forsidekortet, og lederens ferdige lenke som tydelig blokk med kopiknapp. */
.plate .nx{display:block;margin-top:7px;font-size:.84rem;font-weight:700;color:var(--gold-soft)}
.out .mylink{display:block;margin:10px 0 2px;padding:12px 14px;border-radius:var(--r-in);
  background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  font:700 .95rem/1.4 ui-monospace,monospace;word-break:break-all;unicode-bidi:isolate}
.out .copyb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  margin-top:8px;padding:10px 18px;border:1px solid var(--gold-soft);border-radius:var(--r-btn);
  background:transparent;color:var(--chalk);font:800 .92rem/1.15 var(--display);cursor:pointer}
.out .copyb:hover,.out .copyb:focus-visible{border-color:var(--gold);outline:none}
.out .shareb{border:1.5px solid transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box}
/* #233: for lederen er DELING hovedhandlingen - den faar den fylte fargen; bio-knappen blir en rolig kantknapp.
   Foer var «Kopier lenken til bioen» sidens mest fargerike knapp og «Del» graa. */
html[data-page="leaders"] .out .shareb{background:var(--grad) !important;color:#08080B !important;border:0 !important;font-weight:800}
html[data-page="leaders"] .out .bio button{background:transparent !important;color:var(--chalk) !important;border:1.5px solid var(--rule) !important}
.out .shareb .c::before{content:"\2197";margin-inline-end:6px}
.sharemenu{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#spon .sharepill{display:inline-flex !important;align-items:center;gap:5px;min-height:28px;width:auto !important;flex:0 0 auto !important;margin:0 !important;margin-inline-start:auto !important;
  padding:0 10px !important;border-radius:999px !important;cursor:pointer;text-decoration:none !important;white-space:nowrap;
  border:1.5px solid transparent !important;background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box !important;color:var(--chalk) !important;font:800 .75rem/1 var(--display) !important}
#spon .sharepill .c::before{content:"\2197";margin-inline-end:5px}
#spon .spmenu{flex-basis:100%;margin:8px 0 4px}

.sharemenu button{appearance:none;background:transparent;cursor:pointer}
.sharemenu a,.sharemenu button{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);color:var(--chalk);font:700 .85rem/1 var(--display);text-decoration:none}

.joinbtn{display:flex;width:100%;margin-top:12px}
:root[data-theme="dark"] .out .apply::after,:root[data-theme="dark"] .nextb::after,:root[data-theme="dark"] .joinbtn::after{opacity:.85}

/* --- Nivaa 2: sekundaer. Omriss, samme hoeyde og radius, aldri understrek. --- */
.back,.menu .share,#notice-none .dlink,#spon .dlink{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:46px;padding:11px 18px;border:1px solid var(--edge-ui);border-radius:var(--r-btn);
  background:transparent;color:var(--chalk);font:700 .95rem/1.15 var(--display);
  text-decoration:none;cursor:pointer;transition:border-color .18s ease,transform .12s ease}
.back:hover,.menu .share:hover,#notice-none .dlink:hover,#spon .dlink:hover,
.back:focus-visible,.menu .share:focus-visible,#notice-none .dlink:focus-visible,#spon .dlink:focus-visible{border-color:var(--gold-soft);outline:none}
.back:active,.menu .share:active,#notice-none .dlink:active,#spon .dlink:active{transform:scale(.985)}
#spon .dlink{margin-top:8px}
/* Founder 17.10: lenke-knappene saa «hvite og doede» ut. Full bredde, gullkant,
   fast retningspil - samme hoeyde og radius som resten av knappene. */
#spon .dlink,.ib .dlink{display:flex;width:100%;min-height:48px;
  border:1.5px solid transparent;border-radius:var(--r-btn);font-weight:800;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box}
/* Forsidekortet (founder 17.10 03:26): egen-lenke er en LITEN pille her - hovedplassen
   er under IB og bonuser. Kortet skal ikke rope; det peker. */
#notice-none .ownhint,#spon .ownhint{margin:14px 0 0;font-size:.8rem;line-height:1.4;font-weight:500;color:var(--chalk-dim)}
#notice-none .ownhint + .dlink,#notice-none .ownhint + .slab,#spon .ownhint + .dlink{margin-top:6px}
#spon .owngrp{order:99;flex-basis:100%;width:100%;display:flex;flex-direction:column;align-items:flex-start}
/* #109 «Feil sponsor, eller inviterer du selv?» - én liten rad, aapnes ved behov */
#spon .spmore{order:100;flex-basis:100%;width:100%;margin-top:10px}
#spon .spmore > summary{display:inline-flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;list-style:none;
  font-size:.84rem;font-weight:600;color:var(--chalk-dim);text-decoration:underline;text-underline-offset:3px}
#spon .spmore > summary::-webkit-details-marker{display:none}
#spon .spmore > summary::after{content:"\203A";transition:transform .15s ease;display:inline-block}
#spon .spmore[open] > summary::after{transform:rotate(90deg)}
html[dir="rtl"] #spon .spmore > summary::after{content:"\2039"}
html[dir="rtl"] #spon .spmore[open] > summary::after{transform:rotate(-90deg)}
#spon .spmore .dcheck{margin-top:2px}
#spon .spmore .owngrp{display:flex;flex-direction:column;align-items:flex-start}
#spon .owngrp .ownhint{margin-top:10px}
#spon .owngrp .dlink.tiny{margin:6px 0 0;margin-inline:0;align-self:flex-start}
/* #141: «Inviterer du andre? Lag din egen app-side ›» - tydelig lenke, ett trykk rett til soeknaden. */
#spon .owncta{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;font-size:.9rem;font-weight:700;
  color:var(--chalk);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--teal,#2EC4B6)}
#spon .owngrp + .spmore{margin-top:0}
/* #143: blikkfang - gull/turkis-pille, saa de som vil invitere ser at dette er neste trekk. */
#spon .owncta{text-decoration:none;padding:8px 12px;font-size:.84rem;border-radius:999px;border:1.5px solid transparent;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,linear-gradient(90deg,#F5C451,#2EC4B6) border-box;color:#F5C451}
:root[data-theme="light"] #spon .owncta{color:#8A6100}
#notice-none .dlink{display:inline-flex;width:auto;min-height:28px;margin-top:10px;
  padding:3px 10px;border:1px solid var(--rule);border-radius:999px;font:700 .72rem/1.15 var(--display);
  background:transparent;color:var(--chalk-dim)}
#notice-none .dlink:hover,#notice-none .dlink:focus-visible{border-color:var(--gold-soft);color:var(--chalk);filter:none}
#notice-none .slab.reg#nn-own{margin-top:10px}
#spon .dlink:hover,#notice-none .dlink:hover,.ib .dlink:hover,
#spon .dlink:focus-visible,#notice-none .dlink:focus-visible,.ib .dlink:focus-visible{
  filter:brightness(1.18);border-color:transparent}
#spon .dlink::after,#notice-none .dlink::after,.ib .dlink::after{content:"\203A";
  color:var(--gold-soft);font-size:1.2em;font-weight:800;line-height:1}
html[dir="rtl"] #spon .dlink::after,html[dir="rtl"] #notice-none .dlink::after,
html[dir="rtl"] .ib .dlink::after{content:"\2039"}
/* «Min egen lenke»: kompakt pille med gradientkant - merkets signatur, ikke en graa strek
   (founder 17.10 02:35). Fyllet foelger sideflaten i begge tema. */
/* Bitteliten og diskret, ytterst til hoeyre paa navneraden (founder 17.10 03:36). */
#spon .dlink.tiny,.spon .dlink.tiny{display:inline-flex;align-items:center;width:auto;min-height:28px;
  margin:0 0 0 auto;margin-inline-start:auto;margin-inline-end:0;align-self:center;
  padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:transparent;
  color:var(--chalk-dim);font:700 .72rem/1.15 var(--display);text-decoration:none}
#spon .dlink.tiny::after{content:"\203A";margin-inline-start:5px;color:var(--chalk-dim);font-size:1em}
html[dir="rtl"] #spon .dlink.tiny::after{content:"\2039"}
#spon .dlink.tiny:hover,#spon .dlink.tiny:focus-visible{border-color:var(--gold-soft);color:var(--chalk);filter:none}
.back{min-height:40px;padding:8px 14px;font-size:.9rem;border-color:var(--rule)}
.menu .share{margin-top:16px;padding-inline:18px 20px}
.ldlink{display:inline-flex;min-height:36px;margin:4px 0;padding:6px 12px;font-size:.9rem}

/* --- Nivaa 3: tekstknapp. Farge, ingen strek foer hover. --- */
.prog button,.ordb{color:var(--gold-soft);text-decoration:none;font-family:var(--face)}
.prog button:hover,.prog button:focus-visible{text-decoration:underline;text-underline-offset:3px}

/* --- Brikker: spraak, faner, perioder, beloep. Aktiv = fylt jet. Én regel. --- */
.switch button,.jump button,.cper button,.cpre button,.langs a{
  min-height:40px;padding:8px 14px;border:1px solid var(--rule);border-radius:var(--r-chip);
  background:transparent;color:var(--chalk);font:700 .84rem/1 var(--display);cursor:pointer;
  transition:border-color .15s ease,background-color .15s ease}
.switch button{background:var(--ink-deep);padding:8px clamp(6px,2vw,14px)}
.switch{gap:3px}
/* Skriftvalget (Roman Urdu / اردو) foelger samme brikkeregel: aktiv = fylt jet. */
.script button{min-height:40px;border:1px solid var(--rule);background:transparent;color:var(--chalk)}
.script button[aria-pressed="true"]{background:var(--jet);border-color:var(--jet);color:var(--jet-on)}
.script button:hover,.script button:focus-visible{border-color:var(--gold-soft);outline:none}
/* Spraakraden maa aldri skyve siden sidelengs (maalt 16.10: 13 px i engelsk, 37 px i
   urdu paa 390 px). Blir den for bred, ruller den innenfor seg selv. */
.switch{max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.switch::-webkit-scrollbar{display:none}
.cpre button{border-style:solid;color:var(--chalk-dim)}
.switch button:hover,.jump button:hover,.cper button:hover,.cpre button:hover,.langs a:hover,
.switch button:focus-visible,.jump button:focus-visible,.cper button:focus-visible,.cpre button:focus-visible{border-color:var(--gold-soft);outline:none}
.switch button[aria-pressed="true"],.jump button[aria-selected="true"],.cper button[aria-pressed="true"],.cpre button[aria-pressed="true"]{
  background:var(--jet);border-color:var(--jet);color:var(--jet-on);box-shadow:none}
.switch .thm{border-style:dashed;color:var(--chalk-dim)}
.jump{padding:10px 0 4px}

/* --- Fokus for alle som bruker tastatur/skjermleser. --- */
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}

/* --- Framdrift i guiden: ikke konsoll-tekst. Linje, stolpe, hovedknapp. --- */
.prog{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 14px;margin:0 0 22px;
  font-family:var(--face);font-size:.9rem;color:var(--chalk-dim)}
#prog-t{grid-area:1/1;color:var(--chalk);font-weight:600}
#prog-r{grid-area:1/2;justify-self:end;font-size:.84rem}
.prog .bar{grid-area:2/1/3/3;height:5px;border-radius:999px}
.prog .bar i{background:var(--aim)}
.progn{grid-area:3/1/4/3;display:block}
.progn .alld{display:block;margin:0 0 8px}

/* --- Klebefeltet: hårstrek under, saa det har en kant naar det ligger over tekst. --- */
.topbar{box-shadow:0 1px 0 var(--rule)}
/* Topplinje v2 (founder 17.10 20:15 «forenkling»): ÉN slank rad - tilbake-pil + faner som kan sveipes. */
.topbar{flex-wrap:nowrap !important;gap:8px !important;padding-block:8px !important}
.topbar .back{flex:0 0 auto;min-height:36px !important;padding:0 12px !important;font-size:.82rem !important}
.topbar .jump{flex:1 1 auto !important;order:0 !important;flex-wrap:nowrap !important;overflow-x:auto;padding:0 !important;gap:6px;
  scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
html[dir="rtl"] .topbar .jump{-webkit-mask-image:linear-gradient(270deg,#000 85%,transparent);mask-image:linear-gradient(270deg,#000 85%,transparent)}
.topbar .jump button{min-height:36px !important;padding:0 12px !important;font-size:.8rem !important;white-space:nowrap}
.topbar .minip{flex:0 0 auto}
/* #206 (founder «verktøy knappen og folder er enda ikke optimal … finne frem til ting fort»): paa 360 px
   saa man bare 2 av 4 faner (Dagbok og Lenker skjult bak sveip uten tegn). Fortsatt ÉN rad (17.10), men
   fire like brede faner med ikon over kort tekst - alle synlige uten sveip. */
.topbar .jump,html[dir="rtl"] .topbar .jump{display:grid !important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);overflow:visible;gap:4px;
  -webkit-mask-image:none;mask-image:none}
.topbar .jump button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;
  min-height:50px !important;padding:5px 2px !important;border-radius:12px;white-space:normal;text-align:center;font-size:.68rem !important;line-height:1.15;letter-spacing:-.01em}
.topbar .jump button .ti{margin:0;font-size:1.05rem;line-height:1}
.topbar .jump button .tl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
html[data-font="nastaliq"] .topbar .jump button{line-height:1.5;padding-block:3px !important}
/* #139 (founder 18.10 05:35: «svarte bokser bak noen skrifter som strekker seg helt ut»):
   klebefeltet var en helsvart stripe kant til kant. Naa en svevende, avrundet glass-stripe: delvis
   gjennomsiktig, myk skygge. Blur bare paa telefoner med kraft (.fx) - billige telefoner faar samme
   form, litt tettere, uten blur, saa scrolling ikke lagger. */
.topbar{top:8px !important;border-radius:14px;padding-inline:10px !important;margin-inline:-4px;
  background:color-mix(in srgb,var(--ink) 88%,transparent) !important;
  border:1px solid color-mix(in srgb,var(--chalk) 9%,transparent);
  box-shadow:0 10px 26px -16px rgba(0,0,0,.65) !important}
html.fx .topbar{background:color-mix(in srgb,var(--ink) 62%,transparent) !important;
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
:root:not([data-theme="dark"]) .topbar{box-shadow:0 10px 24px -18px rgba(26,16,30,.35) !important}
/* #139: uten faner (Start) er feltet bare framdriften - en liten pille til siden, ikke en tom stripe. */
.topbar:not(:has(.jump button)){width:max-content;max-width:100%;margin-inline-start:auto;margin-inline-end:0}
/* #139: merknadsboksene var tette, moerke blokker i full bredde. Naa en lett, gjennomsiktig tone med
   avrundede hjoerner; fargestripen paa siden beholder betydningen (merknad / advarsel). */
.vnote{background:color-mix(in srgb,var(--chalk) 4.5%,transparent);border:0;border-inline-start:3px solid var(--gold-metal);
  border-radius:12px !important}
:root[data-theme="dark"] .warn{background:color-mix(in srgb,var(--ember) 9%,transparent);border:0;border-inline-start:3px solid var(--ember)}
.warn{border-radius:12px !important}


/* --- Varselboksen (ingen sponsor): rolig flate med siktelinje oeverst, ikke tykk marg. --- */
.notice{position:relative;overflow:hidden;border:1px solid var(--rule);border-radius:var(--r-card);
  border-inline-start:1px solid var(--rule)}
.notice::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--aim)}
.notice.alert{border-color:var(--ember)}
.notice.alert::before{background:var(--ember)}
/* #174: «Hvem inviterte deg?» er et valg, ikke en advarsel - ingen oransje ramme, to rader som lederlista */
#notice-conflict{border-color:var(--rule);background:var(--ink-deep)}
#notice-conflict::before{background:var(--aim)}
#notice-conflict #nc-t{color:var(--chalk);font-size:1.02rem;font-weight:700;line-height:1.45;margin-bottom:14px}
#notice-conflict .choice{display:grid;gap:8px}
#notice-conflict .choice button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0;padding:10px 14px;border:1px solid var(--rule);border-radius:14px;background:transparent;color:var(--chalk);font:700 1rem/1.2 var(--face,inherit);text-align:start;cursor:pointer;box-shadow:none}
#notice-conflict .choice button:active{background:rgba(255,255,255,.06)}
#notice-conflict .choice .avi{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:linear-gradient(135deg,#15D8C4,#1B4FD8 55%,#C21FBF);color:#fff}
#notice-conflict .choice .ncn{flex:1;min-width:0}
#notice-conflict .choice .ncp{font-size:1.4rem;opacity:.6}
html[dir="rtl"] #notice-conflict .choice .ncp{transform:scaleX(-1)}

/* --- Menyen: to fremhevede kort, resten som liste. Ingen regnbuestriper. --- */
.menu{gap:12px}
.plate{grid-template-columns:1fr 24px;gap:0 14px;padding:0 20px;border-radius:var(--r-card);position:relative}
.plate > .stripe{display:none}
.plate > .bd{padding:20px 0}
.plate > .go{margin-inline-end:0;color:var(--chalk-dim)}
.plate[data-cat]{--cat:transparent;background:var(--ink-deep);border-color:var(--rule)}
:root:not([data-theme="dark"]) .plate[data-cat]:not([data-cat="start"]){background:var(--ink-deep);border-color:var(--rule)}
.plate.feat{overflow:hidden}
/* #163: IB-flisen over hele bredden - et halvt kort ved siden av et tomt felt så uferdig ut */
.plate.feat[data-cat="ib"]{grid-column:1/-1}
.plate.feat::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--aim)}
.plate.feat .t{font-size:1.32rem}
.plate.feat > .go{color:var(--chalk)}
.plate[data-cat="start"]{border-color:var(--rule)}
:root[data-theme="dark"] .plate[data-cat="start"]{border-color:var(--rule)}
.plate:hover{border-color:var(--edge-ui);box-shadow:none}
.plate.feat:hover{border-color:var(--gold-soft)}
.mlist{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden;background:var(--ink-deep)}
.mlist .plate{border:0;border-radius:0;background:transparent}
.mlist .plate + .plate{border-top:1px solid var(--rule)}
.mlist .plate > .bd{padding:15px 0}
.mlist .plate .t{font-size:1.06rem;margin-bottom:3px}
.mlist .plate .d{font-size:.9rem;line-height:1.45}
.mlist .plate:hover{background:var(--ink-raise)}
.plate .pg i > b{background:var(--aim)}

/* Lista er ikke direkte barn av menyen, saa inntoningen treffer den ikke - vis den rett. */
.mlist .plate{opacity:1;animation:none;transform:none}
/* .prog button slaar .nextb paa spesifisitet - hovedknappen maa vinne. */
.prog .nextb{background:var(--jet);color:var(--jet-on);border:0;padding:14px 22px 16px;min-height:52px;
  border-radius:var(--r-btn);font:800 1rem/1.15 var(--display);text-decoration:none}
.prog .nextb:hover,.prog .nextb:focus-visible{text-decoration:none;filter:brightness(1.07)}
html[data-font="nastaliq"] .prog .nextb,html[data-font="naskh"] .prog .nextb,html[data-font="deva"] .prog .nextb{font-family:var(--face);line-height:1.6}

/* --- Soek i hele guiden (founder 16.10): ett felt oeverst paa forsiden, treff hopper dit. --- */
/* Soeket bor bak et lupe-ikon i toppraden (founder 16.10: feltet midt paa
   forsiden var stygt og feilplassert). Ikonet aapner et ark over siden, fra
   alle visninger; feltet faar fokus med en gang. */
.mast .sbtn{order:2;margin:0 0 12px auto;padding:0;width:40px;height:40px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--ink-raise);border:1.5px solid var(--edge-ui);border-radius:999px;color:var(--chalk);
  box-shadow:0 2px 10px rgba(0,0,0,.35)}
.mast .switch{order:3}
.mast .sbtn svg{width:19px;height:19px}
.mast .sbtn:hover,.mast .sbtn:focus-visible{color:var(--chalk);border-color:var(--gold-metal)}
/* Bred skjerm: alt paa én linje - spraakene skyves til hoeyre, lupa ytterst. */
@media (min-width:700px){
  .mast .switch{order:2;margin-inline-start:auto}
  .mast .sbtn{order:3;margin:0 0 8px 0}}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;overflow:auto;background:var(--ink);
  padding:max(14px,env(safe-area-inset-top)) 16px 28px}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  .sheet{background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
.sheet[hidden]{display:none}
.sheet-in{max-width:var(--measure);margin:0 auto}
.qbar{display:flex;align-items:center;gap:8px;background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:var(--r-btn);padding:4px 6px 4px 14px}
.qbar .qi{width:20px;height:20px;color:var(--chalk-dim);flex:0 0 auto}
.qbar input{flex:1 1 auto;min-width:0;background:transparent;border:0;color:var(--chalk);font:inherit;
  font-size:16px;padding:12px 0;outline:none}
.qbar input::-webkit-search-cancel-button{display:none}
.qbar .qx{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:999px;background:transparent;
  color:var(--chalk-dim);font:inherit;font-size:16px;cursor:pointer}
.qbar .qx:hover,.qbar .qx:focus-visible{background:var(--ink-raise);color:var(--chalk);outline:none}
body.q-open{overflow:hidden}
.qout{margin-top:10px;border:1px solid var(--rule);border-radius:var(--r-card);background:var(--ink-deep);overflow:hidden}
.qres{display:block;width:100%;text-align:start;padding:12px 14px;border:0;border-top:1px solid var(--rule);background:transparent;color:var(--chalk);font:inherit;cursor:pointer}
.qres:first-child{border-top:0}
.qres:hover,.qres:focus-visible{background:var(--ink-raise);outline:none}
.qres b{display:block;font-family:var(--display);font-size:.98rem}
.qres span{display:block;color:var(--chalk-dim);font-size:.88rem;line-height:1.45;margin-top:2px}
.qres small{display:block;color:var(--gold-soft);font-size:.78rem;margin-top:4px}
.qnone{padding:12px 14px;color:var(--chalk-dim);font-size:.9rem}
html[data-font="nastaliq"] .qres b,html[data-font="naskh"] .qres b,html[data-font="deva"] .qres b{font-family:var(--face)}

/* --- «Ha Aimpire paa telefonen»: liten, rolig rad paa forsiden. --- */
.keep{max-width:var(--measure);margin:14px 0 4px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r-card);background:var(--ink-deep)}
.shell:not([data-view="menu"]) .keep{display:none}
.keep-h{display:flex;align-items:center;gap:10px}
.keep-h strong{font-family:var(--display);font-size:1rem}
.keep{padding:0;border:0;background:none;margin:12px 0 2px}
.keep:not(.open) > :not(.keep-pill){display:none}
.keep-pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:transparent;color:var(--chalk-dim);font:700 .8rem/1 var(--display)}
.keep-pill:hover,.keep-pill:focus-visible{border-color:var(--gold-soft);color:var(--chalk);outline:none}
/* #143 (founder 18.10 15:42 «hva med hvordan de skal gjøre den om til app»): den lille graa pillen
   ble oversett. Naa en tydelig knapp i full bredde med gull/turkis-kant. */
.keep-pill{width:100%;justify-content:center;min-height:48px;font:800 .95rem/1.2 var(--display);color:var(--chalk);
  border:1.5px solid transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,linear-gradient(90deg,#15D8C4,#F5C451) border-box}
.keep.open{padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r-card);background:var(--ink-deep)}
.keep.open .keep-pill{margin-bottom:6px;border-color:var(--gold-soft);color:var(--chalk)}
.keep.open .keep-h strong{display:none}
.keep-x{margin-inline-start:auto;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--chalk-dim);cursor:pointer;font-size:18px;line-height:1}
.keep-x::before{content:"\00d7"}
.keep-x:hover{color:var(--chalk)}
.keep p{margin:6px 0 0;font-size:.92rem;color:var(--chalk-dim)}
.keep-go{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;min-height:38px;padding:8px 15px;
  border:1.5px solid transparent;border-radius:999px;
  background:linear-gradient(var(--ink-raise),var(--ink-raise)) padding-box,var(--grad) border-box;
  color:var(--chalk);font:750 .88rem/1.15 var(--display);cursor:pointer}
.keep-go:hover,.keep-go:focus-visible{filter:brightness(1.18);outline:none}
.keep-how{margin-top:8px;border:0;background:transparent}
.keep-how > summary{padding:6px 0;font-size:.9rem;color:var(--gold-soft)}
.keep-how p{margin:4px 0 0;font-size:.9rem}
.keep-chrome{display:inline-flex;align-items:center;margin-top:8px;min-height:40px;padding:8px 14px;border:1px solid var(--edge-ui);border-radius:var(--r-btn);color:var(--chalk);text-decoration:none;font:700 .9rem/1.15 var(--display)}
html[data-font="nastaliq"] .keep-h strong,html[data-font="naskh"] .keep-h strong,html[data-font="deva"] .keep-h strong,
html[data-font="nastaliq"] .keep-go,html[data-font="naskh"] .keep-go,html[data-font="deva"] .keep-go{font-family:var(--face);line-height:1.6}

/* --- Skrift paa knapper for deva/naskh/nastaliq: morsmaalets font, mer luft. --- */
html[data-font="deva"] :is(.out .apply,.nextb,.joinbtn,.back,.menu .share,#notice-none .dlink,#spon .dlink,.switch button,.jump button,.cper button),
html[data-font="naskh"] :is(.out .apply,.nextb,.joinbtn,.back,.menu .share,#notice-none .dlink,#spon .dlink,.switch button,.jump button,.cper button),
html[data-font="nastaliq"] :is(.out .apply,.nextb,.joinbtn,.back,.menu .share,#notice-none .dlink,#spon .dlink,.switch button,.jump button,.cper button){
  font-family:var(--face);letter-spacing:0;line-height:1.5}
html[data-font="nastaliq"] :is(.out .apply,.nextb,.joinbtn){padding-block:12px 16px;line-height:1.7}
html[data-font="nastaliq"] :is(.switch button,.jump button,.cper button){line-height:1.7;padding-block:6px}

/* Korte skjermer (360x640): paa menyvisningen uten sponsor skal foerste kort
   over kanten. Varselboksen er tittel + knapp der (avsnittene er skjult), saa
   den strammes - teksten roeres ikke. Maalt 16.10 foer: foerste kort 617 px. */
@media (max-height:700px){
  .shell[data-view="menu"] #notice-none{padding:14px 16px 14px}
  .shell[data-view="menu"] #notice-none h2{font-size:1rem;line-height:1.3;margin:0}
  .shell[data-view="menu"] #notice-none .dlink{margin-top:10px;min-height:42px;padding-block:9px}
  .shell[data-view="menu"] .hero{padding-bottom:16px}
  .shell[data-view="menu"] .hero p{margin-top:10px}
  .shell[data-view="menu"] .menu{padding-top:2px}
  .shell[data-view="menu"] .menu .mlede{margin-bottom:8px;font-size:.98rem}
  .plate.feat > .bd{padding:17px 0}
}
/* Med sponsor: paa menyen holder én linje («Sara invited you · goes to …»).
   Dobbeltsjekken og «egen lenke» hoerer til der registreringen skjer - start-
   visningen - og tok 345 px paa en 640 px skjerm (maalt 16.10). */
.shell[data-view="menu"] .spon{align-items:center}

.portalbtn{display:inline-flex;align-items:center;gap:10px;min-height:46px;margin:6px 0 14px;padding:10px 16px 10px 12px;
  border-radius:999px;border:1.5px solid var(--rule-strong, rgba(20,16,28,.18));background:var(--paper, #fff);
  color:var(--jet);font:700 .95rem/1.2 var(--face);text-decoration:none;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 16px -10px rgba(20,16,28,.45),0 1px 3px rgba(20,16,28,.10);
  transition:transform .15s ease,box-shadow .15s ease}
.portalbtn:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 22px -10px rgba(20,16,28,.5),0 1px 3px rgba(20,16,28,.12)}
.portalbtn:active{transform:translateY(1px)}
.portalbtn:focus-visible{outline:3px solid #1B4FD8;outline-offset:3px}
.portalbtn .pi{width:26px;height:26px;border-radius:50%;flex:0 0 26px;background:linear-gradient(135deg,#15D8C4,#1B4FD8 55%,#C21FBF)}
.portalbtn .pa{opacity:.6;font-weight:400}
.srcbtn{margin:2px 0 18px}
.srcbtn img{width:26px;height:26px;border-radius:6px;flex:0 0 26px;object-fit:contain;background:#fff}
html[dir="rtl"] .portalbtn .pa{transform:scaleX(-1)}
:root[data-theme="dark"] .portalbtn{background:var(--ink-raise, #1A1A22);color:var(--jet);border-color:rgba(244,242,247,.18);box-shadow:none}
/* Øktklokke (#75, research #71 idé 1): fire økter vist i medlemmets egen tid. Bygger på
   nettleserens tidssonestøtte (Intl), så sommertid håndteres uten data. */
.ssbar{position:relative;height:74px;margin:6px 0 14px;border-radius:12px;background:var(--ink-raise, rgba(20,16,28,.04));
  border:1px solid var(--rule, rgba(20,16,28,.08));overflow:hidden}
.ssbar .row{position:absolute;inset-inline:0;height:12px}
.ssbar .seg{position:absolute;top:0;height:12px;border-radius:999px;opacity:.85}
.ssbar .now{position:absolute;top:0;bottom:0;width:2px;background:var(--jet);border-radius:2px}
.ssbar .now::after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--jet)}
.ssbar .tk{position:absolute;bottom:3px;font-size:.66rem;color:var(--chalk-dim);transform:translateX(-50%)}
.sslist{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sslist li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule, rgba(20,16,28,.08));background:var(--paper, #fff)}
.sslist .cn{display:flex;align-items:center;gap:8px;font-weight:700}
.sslist .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.sslist .hr{font-size:.9rem;font-variant-numeric:tabular-nums}
.sslist .st{font-size:.82rem;color:var(--chalk-dim)}
.sslist li.on{border-color:transparent;box-shadow:0 0 0 2px var(--c) inset}
.sslist li.on .st{color:var(--jet);font-weight:600}
.ssline{margin:6px 0}
/* #93: banner naar siden er aapnet inne i en app (Instagram, TikTok, WhatsApp ...). */
.inappbar{position:sticky;top:0;z-index:40;margin:0 0 10px;padding:12px 14px;border-radius:0 0 14px 14px;
  background:linear-gradient(135deg,#1B4FD8,#C21FBF);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.inappbar p{margin:0 0 8px;font-size:.92rem;line-height:1.45}
.iab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.iab-go{display:inline-flex;align-items:center;min-height:42px;padding:8px 16px;border-radius:999px;background:#fff;color:#111;font-weight:800;text-decoration:none}
.iab-ios{font-size:.86rem;opacity:.95}
.iab-x{margin-inline-start:auto;min-width:36px;min-height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem;cursor:pointer}
/* #93: bio-boksen paa ledersiden */
.bio{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed var(--gold-soft, #E3B505)}
.bio b{display:block;margin-bottom:4px}
.bio,.bio p,.bio b{word-break:normal;overflow-wrap:break-word;font-family:inherit}
.bio p{margin:0 0 10px;font-size:.9rem;line-height:1.5}
.bio button{min-height:42px;padding:8px 16px;border-radius:999px;border:0;background:var(--grad-ink);color:#fff;font-weight:800;cursor:pointer}

/* TradingView ignorerer «compact» (maalt: iframe 84 px + lenke 32 px = 116 px). Skalert til 62 %: 52 px kurser + 12 px lenke.
   Widgeten setter egne inline-stiler og !important - derfor !important her (hoeyere spesifisitet vinner). */
.tvtape .tradingview-widget-container{height:64px !important;overflow:hidden}
.tvtape iframe{transform:scale(.62);transform-origin:0 0;width:161.3% !important;height:84px !important}
.tvtape .tradingview-widget-copyright{position:absolute !important;left:0;right:0;bottom:0;height:12px !important;padding:0 12px !important;
  text-align:end !important;font:600 9px/12px var(--face) !important;opacity:.75}
.tvtape .tradingview-widget-copyright a{color:var(--chalk-dim);text-decoration:none}
.tvtape .tvlast{appearance:none;width:100%;height:100%;border:0;background:transparent;color:var(--chalk);font:700 .82rem/1 var(--face);cursor:pointer}
/* #205 (founder «på hjem skjermen må også frem hvilken marked som er aktiv … hvilken session er vi i pr nå»):
   én linje under kursene. Trykk = markedskortet i Verktøy. Fast hoeyde, saa ingenting hopper naar den fylles. */
.oekt{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:5px;width:calc(100% + 32px);margin:0 -16px;min-height:54px;padding:8px 16px;box-sizing:border-box;
  border:0;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--ink) 70%,transparent);color:var(--chalk);
  font:700 .84rem/1.2 var(--face);text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.oekt[hidden]{display:grid !important;visibility:hidden}
.oekt .r1{grid-column:1;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;
  padding:6px 0 6px 8px;margin:-6px 0 -6px -8px}   /* plass til pulsringen innenfor overflow:hidden */
html[dir="rtl"] .oekt .r1{padding:6px 8px 6px 0;margin:-6px -8px -6px 0}
.oekt .lab{font:800 .66rem/1 var(--face);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-dim)}
.oekt.sover .lab{text-transform:none;letter-spacing:0;font:600 .82rem/1.2 var(--face);white-space:normal}
.oekt .puls{position:relative;flex:none;width:8px;height:8px;border-radius:50%;background:#15D8C4}
.oekt .puls::after{content:"";position:absolute;inset:0;border-radius:50%;background:#15D8C4;animation:oektpuls 2.4s ease-out infinite}
.oekt.sover .puls{background:var(--chalk-dim)}.oekt.sover .puls::after{display:none}
@keyframes oektpuls{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.oekt .puls::after{animation:none;opacity:0}}
.oekt .okchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);font:800 .78rem/1 var(--face);color:var(--chalk)}
.oekt .okchip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.oekt .r2{grid-column:1;display:flex;align-items:center;gap:8px;min-width:0}
.oekt .bar{flex:none;width:52px;height:4px;border-radius:999px;background:color-mix(in srgb,var(--chalk) 12%,transparent);overflow:hidden}
.oekt .bar b{display:block;height:100%;border-radius:inherit;background:var(--c)}
html[dir="rtl"] .oekt .bar{transform:scaleX(-1)}
.oekt .st{min-width:0;overflow:hidden;text-overflow:ellipsis;font:600 .76rem/1.2 var(--face);color:var(--chalk-dim);white-space:nowrap}
.oekt .go{grid-column:2;grid-row:1 / span 2;font-size:1.3rem;line-height:1;color:var(--chalk-dim)}
html[dir="rtl"] .oekt .go{transform:scaleX(-1)}
/* #149 Nyhetsradar: egen rad under kursbanneren, sveipes sidelengs, staar stille. */
.nradar{position:relative;z-index:1;margin:0 -16px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;background:color-mix(in srgb,var(--ink) 70%,transparent)}
.nradar::-webkit-scrollbar{display:none}
.nradar[hidden]{display:block !important;visibility:hidden;height:61px}
.nradar{height:61px;box-sizing:border-box}.tape2{min-height:41px;box-sizing:border-box}   /* fast høyde også når de er tomme - ingen hopp */   /* #100: samme for nyhetsraden */
.nrtrk{display:flex;align-items:stretch;width:max-content;padding:8px 16px;gap:0}
.nrlab{scroll-snap-align:start;align-self:center;font:800 .74rem/1 var(--display);color:var(--chalk-dim);padding-inline-end:14px;white-space:nowrap}
.nri{scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:2px 16px;min-height:44px;
  border-inline-start:1px solid var(--rule);text-decoration:none;color:var(--chalk);white-space:nowrap;position:relative}
.nri .imp{position:absolute;top:4px;inset-inline-start:6px;display:flex;flex-direction:column;gap:2px}
.nri .imp i{display:block;width:3px;height:6px;border-radius:2px;background:var(--rule)}
.nri.hi .imp i{background:#F0506E}
.nri.mid .imp i:nth-child(n+2){background:#F5A524}
.nri .l1{display:flex;align-items:baseline;gap:7px;font:600 .8rem/1.1 var(--face)}
.nri .l1 b{font:800 .74rem/1 var(--display);letter-spacing:.03em;color:var(--chalk)}
.nri.hi .l1 b{color:#F0506E}
.nri .l2{display:flex;gap:8px;font:500 .7rem/1 var(--face);color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.nri .par{color:var(--gold-soft,#5EE6D6);font-weight:700}
:root:not([data-theme="dark"]) .nri.hi .l1 b{color:#C42430}
.tk.opp .a{color:#16C784}.tk.ned .a{color:#EA3943}
/* #134: lyst tema - de lyse signalfargene (gull, gul, groenn, roed) naadde 1,8-3,9:1 paa hvit.
   Moerkere varianter av samme farge, maalt >= 4,5:1. Moerkt tema er uendret. */
:root:not([data-theme="dark"]) .mgrow.mv b{color:#8A6100}
:root:not([data-theme="dark"]) .fbrow.gyll b{color:#8A6100}
:root:not([data-theme="dark"]) .cdelta.opp,:root:not([data-theme="dark"]) .cst.opp b{color:#0E7A50}
:root:not([data-theme="dark"]) .cdelta.ned,:root:not([data-theme="dark"]) .cst.ned b,:root:not([data-theme="dark"]) .tk.ned .a{color:#C42430}
:root:not([data-theme="dark"]) .tk.opp .a{color:#0E7A50}
.tk .st{font:700 .66rem/1 var(--display);padding:3px 6px;border-radius:999px;background:var(--rule);color:var(--chalk-dim)}
.tk .lv{position:relative;width:6px;height:6px;border-radius:50%;background:#16C784;align-self:center}
.tk .lv::after,.plive i::after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(21,216,196,.55);opacity:0;pointer-events:none}
@keyframes tkflashO{0%{background:rgba(22,199,132,.35)}100%{background:transparent}}
@keyframes tkflashN{0%{background:rgba(234,57,67,.35)}100%{background:transparent}}
.tk.blink.opp{animation:tkflashO 1.2s ease-out}.tk.blink.ned{animation:tkflashN 1.2s ease-out}
@media (prefers-reduced-motion:no-preference){
  .tape2 .trk{animation:tkrull 38s linear infinite}
  .tape2:hover .trk,html.paused .tape2 .trk{animation-play-state:paused}
  .tk .lv::after{animation:plpuls 1.8s ease-in-out infinite}
}
@keyframes tkrull{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* #186 App-guide: dim + lysende ramme rundt det ekte elementet + kort med stor tekst */

html.touraapen,html.touraapen body{overflow:hidden;overscroll-behavior:none}
/* #209 (founder «ha den låst stående pr nå»): en nettside kan ikke laase rotasjonen i nettleseren (bare installert app,
   via manifest). Liggende telefon (lav hoeyde + touch) faar et «snu telefonen»-ikon uten tekst. iPad/PC beroeres ikke. */
#snu{display:none}

  #snu{display:flex;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center;background:#08080B;color:#fff}
  html{overflow:hidden}
  #snu svg{animation:snu 2.4s ease-in-out infinite}
}

/* PC/Mac (#232): skjema/lenke til venstre, verktøykassen ved siden av - begge synlige uten aa rulle forbi hverandre */
@media (min-width:1024px){
  html[data-page="leaders"] #s-leaders{display:grid;grid-template-columns:minmax(0,1fr) 320px;column-gap:40px;align-items:start}
  html[data-page="leaders"] #s-leaders > :not(.tool):not(.ldkit){grid-column:1 / -1}
  html[data-page="leaders"] #s-leaders > .ldkit{grid-column:2;position:sticky;top:24px;margin-top:0}   /* ingen fast rad: legger seg i samme rad som skjemaet/lenken uansett tilstand */
  html[data-page="leaders"] #s-leaders > .tool{grid-column:1}
  html[data-page="leaders"] #s-leaders .ldkit .kg{grid-template-columns:1fr}
}
.ldstatus{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;margin:4px 0 14px;
  background:color-mix(in srgb,#16C784 10%,transparent)}
.ldstatus .ldv{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#16C784;color:#06120C;font:900 1.2rem/1 var(--display)}
.ldstatus b{display:block;font:800 1.1rem/1.3 var(--display);color:var(--chalk)}
.ldstatus p{margin:4px 0 0;font-size:.92rem;color:var(--chalk-dim)}
.ldagain{margin:14px 0 0;padding:8px 0;border:0;background:none;color:var(--chalk-dim);font:600 .86rem/1.3 var(--face);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tool:not(.ldsendt) .ldagain{display:none}
/* Delseksjonstitler (h3 rett under en seksjon, f.eks. «Aimpire Academy») i samme skrift som overskriftene. */
.sec > h3{font-family:"Archivo",var(--display);font-stretch:90%;font-weight:800;font-size:1.32rem;line-height:1.15;letter-spacing:-.01em;word-spacing:.08em}
html:is([data-font="deva"],[data-font="nastaliq"],[data-font="naskh"]) .sec > h3{font-family:var(--face);font-stretch:normal;letter-spacing:0;line-height:1.5}
/* Merknad/advarsel: ikke farget sidekant (malspor), men et lite tegn foran - ⓘ for merknad, ! for advarsel. */
.vnote,.warn{position:relative;border-inline-start:0 !important;padding-inline-start:44px !important}
.vnote::before,.warn::before{position:absolute;inset-inline-start:14px;top:13px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font:800 .74rem/1 var(--display)}
.vnote::before{content:"i";background:color-mix(in srgb,var(--chalk) 14%,transparent);color:var(--chalk);font-style:italic;font-family:Georgia,serif}
.warn::before{content:"!";background:var(--ember,#E8590C);color:#fff}
.goals .gt{font-family:"Archivo",var(--display);font-stretch:90%;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;word-spacing:.08em}
html:is([data-font="deva"],[data-font="nastaliq"],[data-font="naskh"]) .goals .gt{font-family:var(--face);font-stretch:normal;letter-spacing:0}
html[data-font="nastaliq"] .goals .gl{line-height:1.85;font-size:.8rem}
html[data-font="naskh"] .goals .gl{line-height:1.6}
html[data-font="nastaliq"] .goals .goal{min-height:96px}


/* #236 Sveipepil (moenster fra Androids tilbake-gest): kommer inn fra kanten og foelger fingeren, fylles ved grensen. */
.svpil{position:fixed;top:50%;z-index:58;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;pointer-events:none;
  background:var(--ink-raise,var(--ink));color:var(--chalk);border:1px solid var(--rule);box-shadow:0 8px 24px -8px rgba(0,0,0,.45);
  opacity:calc(.35 + var(--f,0) * .65);transition:background .15s,color .15s,border-color .15s}
.svpil[hidden]{display:none}
.svpil[data-side="h"]{right:0;transform:translate(calc(100% - var(--f,0) * (100% + 12px)),-50%)}
.svpil[data-side="v"]{left:0;transform:translate(calc(-100% + var(--f,0) * (100% + 12px)),-50%);flex-direction:row-reverse}
.svpil .svr{width:10px;height:10px;border-top:2.5px solid currentColor;border-right:2.5px solid currentColor;transform:rotate(45deg)}
.svpil[data-side="v"] .svr{transform:rotate(-135deg)}
.svpil .svn{font:800 .9rem/1 var(--face);white-space:nowrap}
.svpil.tilb .svn{display:none}
.svpil.klar{background:var(--grad);color:#08080B;border-color:transparent}
@media (prefers-reduced-motion:reduce){.svpil{transition:none}}
/* ===== #232 PC og Mac (founder 19.10 23:59 «gjør den også pc og Mac vennlig … best for forbrukeren»).
   Maalt 1440x900: 736 px mobilkolonne midt paa skjermen, flytende mobilmeny nederst over innholdet.
   Fra 1024 px blir SAMME meny en fast sidemeny til venstre (moenster folk kjenner fra nettbank/Discord/Notion):
   alltid synlig, dekker ingenting, og innholdet faar plass. Ingen ny logikk - knappene og rekkefoelgen er de samme,
   saa mobil og guiden (som peker paa menyen) er uendret. RTL: sidemenyen staar til hoeyre (logiske egenskaper). */
@media (min-width:1024px){
  body.has-tabbar{padding-bottom:0;padding-inline-start:236px}
  body.has-tabbar #pille{bottom:28px}
  .tabbar{inset-inline-start:0 !important;inset-inline-end:auto !important;top:0;bottom:0 !important;width:236px !important;max-width:none;
    margin:0 !important;border-radius:0;padding:22px 14px 18px;border-top:0;border-inline-end:1px solid var(--rule);
    display:flex;flex-direction:column;box-shadow:none !important}
  .tabbar .tbprog{display:none}
  .tbrow{display:flex !important;flex-direction:column;gap:3px;max-width:none;margin:0;flex:1;min-height:0}
  .tbrow .tbb{flex-direction:row;justify-content:flex-start;align-items:center;gap:13px;width:100%;min-height:46px;
    padding:10px 14px !important;border-radius:12px;text-align:start;transition:background .15s,color .15s}
  html .tabbar .tbrow .tbb span{font-size:.95rem;letter-spacing:0;font-weight:650}
  .tbb span{overflow:visible}
  .tbb svg{flex:0 0 22px;width:22px;height:22px}
  .tbb:not(.tbhome)::after{display:none}
  .tbb.tbhome{order:-1;margin-bottom:14px;padding-inline:10px !important}
  .tbb.tbhome span{font:800 1.05rem/1 var(--display) !important;letter-spacing:.06em !important}
  .tbring{margin-top:0;width:40px;height:40px;flex:0 0 40px}
  #tb-more{margin-top:auto}
  .tbb .dot{top:12px;inset-inline-start:30px}
  /* Paa mobil er menyen bevisst i MOTSATT farge (#146) for aa skille seg fra innholdet. En sidemeny skal derimot
     hvile i samme flate som siden - ellers blir den en lysende vegg ved siden av moerkt innhold. */
  :root[data-theme="dark"] .tabbar.tabbar,:root:not([data-theme="dark"]) .tabbar.tabbar{background:var(--ink-deep);border-inline-end:1px solid var(--rule)}
  :root[data-theme="dark"] .tbrow .tbb.tbb,:root:not([data-theme="dark"]) .tbrow .tbb.tbb{color:var(--chalk-dim)}
  :root[data-theme="dark"] .tbrow .tbb.tbb[aria-current="page"],:root:not([data-theme="dark"]) .tbrow .tbb.tbb[aria-current="page"]{color:var(--chalk)}
  :root[data-theme="dark"] .tbrow .tbb[aria-current="page"]:not(.tbhome){background:rgba(27,79,216,.18)}
  :root:not([data-theme="dark"]) .tbrow .tbb[aria-current="page"]:not(.tbhome){background:rgba(27,79,216,.09)}
  :root[data-theme="dark"] .tbb .dot,:root:not([data-theme="dark"]) .tbb .dot{box-shadow:0 0 0 2px var(--ink-deep)}
  /* Mer-arket aapnes ved siden av knappen, ikke midt nederst */
  .mspanel{inset-inline-start:248px;inset-inline-end:auto;bottom:18px;width:400px;max-width:calc(100vw - 280px);margin:0}
  .msbg{background:rgba(6,10,24,.25)}
  /* Innholdet: bredere kolonne, men brødtekst holder lesbar linjelengde (--measure) */
  .shell{max-width:62rem}
  .goals .ggrid{grid-template-columns:repeat(6,1fr)}
  .mlist.mgrid{grid-template-columns:repeat(3,1fr)}
  .vhead{margin-top:6px}
}
.sbtn .sbl{display:none}
.sbtn .kbd{display:none}
@media (min-width:1024px){
  .sbtn{width:auto !important;min-width:260px;justify-content:flex-start;gap:10px;padding:0 10px 0 14px !important;border-radius:999px !important}
  .sbtn .sbl{display:inline;flex:1;text-align:start;font:600 .88rem/1 var(--face);color:var(--chalk-dim);white-space:nowrap}
  .sbtn svg{flex:0 0 18px;width:18px;height:18px}
}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
  .sbtn .kbd{display:inline-block}
  .tbrow .tbb.tbb:not([aria-current="page"]):hover{background:color-mix(in srgb,var(--chalk) 6%,transparent);color:var(--chalk)}
  .tbb.tbhome:hover .tbring{box-shadow:0 0 0 2px rgba(21,216,196,.6)}
}
/* Mus og styreflate (alle bredder): tydelig hover og fokus. Paa touch skjer ingenting (hover:hover). */
@media (hover:hover) and (pointer:fine){
  .mlist.mgrid > li > a,.mlist.mgrid > li > button,.goals .ggrid > *,.places > li > a,.mkrow,.mkk,.okchip,.oekt{transition:transform .15s ease,border-color .15s ease,background .15s ease}
  .mlist.mgrid > li > a:hover,.mlist.mgrid > li > button:hover,.goals .ggrid > *:hover{transform:translateY(-2px)}
  .mkrow:hover,.places > li > a:hover{background:color-mix(in srgb,var(--chalk) 5%,transparent)}
  .oekt:hover{border-color:color-mix(in srgb,var(--chalk) 22%,transparent)}
}
:focus-visible{outline:2px solid #15D8C4;outline-offset:2px}
.kbd{display:inline-block;min-width:1.5em;padding:1px 6px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;font:700 .72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--chalk-dim);text-align:center}
@media not all and (hover:hover) and (pointer:fine){.kbd{display:none}}

/* #237 velkomstmodus: bare det enkle første gang (se erVelkomst) */
html.velkomst #tape2,html.velkomst #tvtape,html.velkomst #oekt,html.velkomst #nradar,html.velkomst #keep,
html.velkomst #menu-nav .goals,html.velkomst #menu-nav .wotd,html.velkomst #menu-nav .sharehint,html.velkomst #menu-nav .share,
html.velkomst #menu-nav .plate[data-cat="ib"],html.velkomst #menu-nav .plate[data-cat="chat"],html.velkomst #menu-nav .plate[data-cat="faq"],
html.velkomst #tabbar,html.velkomst .tourigjen,html.velkomst #q-open,html.velkomst #spon .owncta{display:none !important}
html.velkomst body.has-tabbar{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
html.velkomst #menu-nav .mlist{grid-template-columns:1fr}
.vkfull{display:block;width:100%;margin:18px 0 6px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--rule);background:transparent;color:var(--chalk);font:700 .95rem/1.2 var(--face);cursor:pointer}
.vkfull[hidden],.vktilbake[hidden]{display:none}
.vktilbake{position:fixed;inset-inline-start:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:56;padding:12px 18px;min-height:48px;border-radius:999px;border:0;
  background:var(--jet);color:var(--jet-on);font:800 .9rem/1 var(--face);box-shadow:0 10px 30px -8px rgba(20,16,28,.45);cursor:pointer}
.vkfull:focus-visible,.vktilbake:focus-visible{outline:2px solid #15D8C4;outline-offset:3px}

/* #246 (founder 20.10 «turen lagde problemer på noen modeller»): color-mix() krever Chrome 111 / Samsung Internet 22 /
   Safari 16.2 (2023). Eldre telefoner dropper hele deklarasjonen, og flater som ligger OVER innhold ble gjennomsiktige.
   Her får de en vanlig farge. Moderne nettlesere hopper over blokka. Fargetoner på brikker o.l. faller bare bort (ufarlig). */
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .topbar,html.fx .topbar,.sheet,.tvtape,.oekt,.nradar{background:var(--ink)}
  .qans{background:var(--ink-raise,var(--ink))}
  .vnote,.llive,.pfacts .pf,.ldpx{background:rgba(127,127,127,.08)}
  .pfacts .warnf{border-color:#E8590C}
  .ldprev{border-color:#15D8C4;background:rgba(21,216,196,.06)}
  .slab.own,.vpnb,.ldkit .kt,#spon .sharepill,.out .shareb,.iqbtn.ghost{border-color:rgba(127,127,127,.4)}
  .chip,.oekt .okchip{border-color:rgba(127,127,127,.35)}
}
